<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% link assets/css/style.css %}">
    <script src="https://kit.fontawesome.com/a4701a9ef7.js" crossorigin="anonymous"></script>
    {% seo %}
</head>
<body>

<!-- ═══ NAV BANNER ═══ -->
<input type="checkbox" id="nav-toggle" aria-hidden="true">
<nav class="nav-banner">
  <div class="nav-banner-inner">
    <a href="#" class="nav-banner-logo">Lewis <span>Stapleton</span></a>
    <div class="nav-links">
      {% include nav.html %}
      <a href="mailto:{{site.email}}" class="nav-contact-btn">Contact</a>
      <label for="nav-toggle" class="nav-hamburger-label" aria-label="Toggle menu">
        <i class="fa-solid fa-bars"></i>
        <i class="fa-solid fa-xmark"></i>
      </label>
    </div>
    <div class="nav-dropdown">
      {% include nav.html %}
    </div>
  </div>
</nav>

<div class="page-wrapper">
  {{ content }}
</div>

</body>
</html>
